# Reference reverse-proxy settings for https://api.funpace.media.
# Apply these values in the active Nginx server/location block that proxies to the Node API.

server {
  server_name api.funpace.media;

  client_max_body_size 300m;
  client_body_timeout 20m;
  send_timeout 20m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_read_timeout 20m;
    proxy_send_timeout 20m;
    proxy_connect_timeout 60s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
  }
}
